name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core install / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: CLI help
        run: python moderate_image.py --help

      - name: Check installed packages
        run: python -m pip check

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q .

      - name: Test
        run: pytest -q

      - name: CLI help
        run: python moderate_image.py --help

      - name: Check installed packages
        run: python -m pip check

  local-extras:
    name: Local extras smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OCR_ENABLE: "0"
      OPENNSFW2_DISABLE: "1"
      NUDENET_DISABLE: "1"
      FORBIDDEN_SYMBOLS_YOLO_ENABLE: "0"
      API_POLICY: "never"
      NO_CHECKS_POLICY: "review"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install local extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[local,dev]"

      - name: Import local optional engines
        run: python -c "import opennsfw2, nudenet, ultralytics, pytesseract"

      - name: Compile
        run: python -m compileall -q .

      - name: Test without heavy inference
        run: pytest -q

      - name: Check installed packages
        run: python -m pip check
